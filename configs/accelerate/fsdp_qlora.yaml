# FSDP + QLoRA: 4-bit LoRA sharded over the GPUs, parameters offloaded to CPU RAM —
# a 70B model on 2 × 24 GB GPUs (PEFT's guide). `train` (SFT/DPO) only.
#   accelerate launch --config_file configs/accelerate/fsdp_qlora.yaml --num_processes 2 \
#       main.py train --model ... --data ... --peft LoRA
# The app stores the 4-bit weights in the model dtype and loads without a device_map,
# as FSDP requires. mixed_precision is 'no' on purpose: the app picks the precision.
# Based on PEFT's examples/sft/configs/fsdp_config_qlora.yaml.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
downcast_bf16: 'no'
fsdp_config:
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_cpu_ram_efficient_loading: true
  fsdp_forward_prefetch: false
  fsdp_offload_params: true
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_sync_module_states: true
  fsdp_use_orig_params: false
machine_rank: 0
main_training_function: main
mixed_precision: 'no'
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
