# DeepSpeed ZeRO-2: shards gradients and optimizer state (the model itself stays whole
# on each GPU). Needs `pip install deepspeed`. `train` (SFT/DPO) only.
#   accelerate launch --config_file configs/accelerate/deepspeed_zero2.yaml --num_processes 4 \
#       main.py train --model ... --data ...
# mixed_precision is 'no' on purpose: the app picks bf16 / fp16 / fp32 for the GPU.
# Based on TRL's examples/accelerate_configs/deepspeed_zero2.yaml.
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: false
  zero_stage: 2
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: 'no'
num_machines: 1
num_processes: 2
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
