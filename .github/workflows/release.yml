name: Release

# Push a tag `vX.Y.Z` (matching APP_VERSION in config/constants.py) to publish a signed
# release: the wheel and sdist, each signed keylessly with Sigstore using this workflow's
# GitHub OIDC identity, with the CHANGELOG.md section as the notes. Verify a download with:
#   pip install sigstore
#   python -m sigstore verify github --cert-identity \
#     "https://github.com/Yog-Sotho/LLM-fine-tuner/.github/workflows/release.yml@refs/tags/vX.Y.Z" \
#     llm_finetuner_pro-X.Y.Z-py3-none-any.whl
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  SIGSTORE: "sigstore==4.5.0"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # Sigstore keyless signing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Tag must match APP_VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -nE 's/^APP_VERSION = "([^"]+)"$/\1/p' config/constants.py)
          test -n "$version" || { echo "::error::APP_VERSION not found in config/constants.py"; exit 1; }
          test "$TAG" = "v$version" || { echo "::error::tag $TAG does not match APP_VERSION $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build wheel and sdist
        run: |
          python -m pip install --quiet "build>=1.2.0" twine "setuptools>=83" wheel
          python -m build --outdir dist
          python -m twine check --strict dist/*
          test -f "dist/llm_finetuner_pro-$VERSION-py3-none-any.whl" \
            || { echo "::error::the built wheel is not version $VERSION"; ls dist; exit 1; }

      - name: Collect distributions for PyPI
        run: |
          mkdir -p pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: pypi-dist/

      - name: Sign with Sigstore
        run: |
          python -m pip install --quiet "$SIGSTORE"
          python -m sigstore sign dist/*.whl dist/*.tar.gz

      - name: Verify the signatures
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          for f in dist/*.whl dist/*.tar.gz; do
            python -m sigstore verify github --cert-identity "$IDENTITY" "$f"
          done

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::no CHANGELOG.md section for $VERSION"; exit 1; }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --title "LLM Fine-Tuner $VERSION" \
            --notes-file notes.md --verify-tag

  # PyPI upload via Trusted Publishing. Independent of the signed GitHub
  # release above: a PyPI configuration problem never loses the release or
  # its tag, and re-running after a failed upload reuses the existing release.
  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # Trusted Publishing; also uploads PEP 740 attestations
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Container image ghcr.io/<owner>/llm-fine-tuner:{version,latest}, built from
  # Dockerfile.cpu (the CUDA image's torch stack doesn't fit on hosted runners).
  # Each architecture is built natively and pushed by digest; publish-image joins
  # them into one multi-arch image, signs it (keyless) and attaches provenance.
  image:
    needs: release
    name: image (${{ matrix.platform }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/llm-fine-tuner" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.cpu
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=LLM Fine-Tuner
            org.opencontainers.image.description=No-code LLM fine-tuning (CPU image)
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.version=${{ env.VERSION }}
          # Provenance is attached to the multi-arch image in publish-image.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Record digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error

  publish-image:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write   # Sigstore keyless signing
      attestations: write
    steps:
      - run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/llm-fine-tuner" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Create the multi-arch image
        id: index
        run: |
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" \
            "${IMAGE}@$(cat digests/amd64)" "${IMAGE}@$(cat digests/arm64)"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.index.outputs.digest }}"
      - name: Build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
