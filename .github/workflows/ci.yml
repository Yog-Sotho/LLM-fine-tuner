# =============================================================================
# .github/workflows/ci.yml
# LLM Fine-Tuner — Continuous Integration
#
# Triggers
# --------
#   push  → main, develop, release/**
#   PR    → main, develop
#   Manual via workflow_dispatch
#
# Job graph (each → means "needs")
# ----------------------------------
#   lint ──────────────────────────────────────────────────┐
#   type-check  (needs: lint) ─────────────────────────────┤
#   test        (needs: lint) [matrix: py3.10/3.11/3.12] ──┤→ ci-summary
#   security    (needs: lint) ─────────────────────────────┤
#   docker-lint (needs: lint) ─────────────────────────────┤
#   validate-package (needs: lint) ────────────────────────┘
#
# Merge gate: protect the default branch on `ci-summary` only.
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# Cancel any in-flight run for the same branch/PR when a new commit arrives.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# Global least-privilege — individual jobs escalate only what they need.
permissions:
  contents: read

# ---------------------------------------------------------------------------
# Global environment — prevents any job from making unwanted network calls
# to HuggingFace Hub or Gradio telemetry during the test suite.
# ---------------------------------------------------------------------------
env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_COLOR: "1"
  # Tests run offline. The smoke tests' tiny model is pre-fetched into the HF
  # cache by a dedicated step that re-enables the network for itself only.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  # Stop Gradio from phoning home during imports.
  GRADIO_ANALYTICS_ENABLED: "False"
  # Headless matplotlib so import does not open a display.
  MPLBACKEND: "Agg"

# ===========================================================================
# JOB 1 — LINT
# ruff in two passes:
#   ruff format --check  → formatting consistency (no auto-fix in CI)
#   ruff check           → all rules declared in pyproject.toml [tool.ruff]
#                          select = ["E", "F", "W", "I", "UP", "B"]
# ===========================================================================
jobs:
  lint:
    name: "Lint — ruff"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: "Cache pip"
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: "lint-${{ hashFiles('pyproject.toml') }}"
          restore-keys: "lint-"

      - name: "Install ruff"
        # Same version range declared in [project.optional-dependencies] dev
        run: pip install --quiet "ruff==0.16.9"  # pinned: format output changes between releases

      - name: "ruff format --check"
        run: ruff format --check --diff .

      - name: "ruff check"
        # --output-format github annotates PR diffs inline in the Files tab
        run: ruff check --output-format=github .

  # =========================================================================
  # JOB 2 — TYPE CHECK
  # mypy on every layer. torch/transformers/peft/trl are not installed here, so
  # --ignore-missing-imports types them as Any: the job stays fast and checks the
  # project's own code (signatures, None handling, attribute use), not library stubs.
  # =========================================================================
  type-check:
    name: "Type check — mypy"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: "Cache pip"
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: "mypy-${{ hashFiles('pyproject.toml') }}"
          restore-keys: "mypy-"

      - name: "Install mypy + lightweight stubs"
        run: |
          pip install --quiet \
            "mypy>=1.10.0" \
            "pandas-stubs" \
            "types-tqdm" \
            "types-PyYAML" \
            "numpy>=2.0.0" \
            "pandas>=2.2.0" \
            "typer>=0.15.0"

      - name: "Run mypy (all layers)"
        run: |
          mypy \
            config/ \
            core/ \
            data/ \
            training/ \
            inference/ \
            export/ \
            ui/ \
            cli/ \
            main.py \
            --ignore-missing-imports \
            --no-strict-optional \
            --show-error-codes \
            --pretty

  # =========================================================================
  # JOB 3 — TEST
  # Matrix: Python 3.10 × 3.11 × 3.12 on ubuntu-latest.
  #
  # CPU-only PyTorch avoids requiring a GPU runner.
  # All GPU-dependent code paths (train_model, _load_for_inference, etc.)
  # are patched via monkeypatch in the existing test suite.
  #
  # pyproject.toml testpaths = ["tests"], addopts = "-v --tb=short".
  # CI appends --cov flags so local dev runs stay clean; coverage below 85% fails
  # the job (measured 88% when the floor was set). tests/test_gpu.py skips here
  # (no CUDA) — .github/workflows/gpu.yml runs it on a GPU runner.
  #
  # Codecov upload: 3.11 leg only (avoids duplicate reports).
  # =========================================================================
  test:
    name: "Test — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint]

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"

      - name: "Cache pip"
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: >-
            test-py${{ matrix.python-version }}-
            ${{ hashFiles('pyproject.toml', 'requirements.txt') }}
          restore-keys: "test-py${{ matrix.python-version }}-"

      # Install CPU PyTorch before any other dep to avoid pip resolving the
      # CUDA build (~2 GB) from the default PyPI index. torch >= 2.6 is required
      # (CVE-2025-32434). torchvision (VLM tests) comes from the same index so the
      # two builds match.
      - name: "Install CPU-only PyTorch"
        run: |
          pip install --quiet "torch>=2.6.0,<3" torchvision \
            --index-url https://download.pytorch.org/whl/cpu

      # Install the package itself so CI tests exactly the declared dependency ranges.
      - name: "Install package with evaluation extras"
        run: pip install --quiet -e ".[eval]"

      - name: "Install dev / test tools"
        run: |
          pip install --quiet \
            "pytest>=8.0.0" \
            "pytest-cov>=5.0.0" \
            "pytest-timeout>=2.3.0"

      # NLTK data for nlpaug (synonym augmentation uses wordnet and the tagger).
      - name: "Pre-fetch NLTK data"
        run: |
          python -c "
          import nltk
          for pkg in ['punkt', 'punkt_tab', 'wordnet', 'omw-1.4',
                      'averaged_perceptron_tagger', 'averaged_perceptron_tagger_eng']:
              assert nltk.download(pkg, quiet=True), pkg
          print('NLTK data ready')
          "

      # The smoke tests train a ~1M-parameter model for real. Fetch it once here
      # (network allowed for this step only); tests then load it from the cache.
      - name: "Pre-fetch smoke-test model"
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: |
          python -c "
          from huggingface_hub import snapshot_download
          snapshot_download('hf-internal-testing/tiny-random-LlamaForCausalLM')
          snapshot_download('trl-internal-testing/tiny-Qwen3ForCausalLM')
          snapshot_download('trl-internal-testing/tiny-Qwen2_5_VLForConditionalGeneration')
          snapshot_download('trl-internal-testing/tiny-Qwen3MoeForCausalLM')
          print('Smoke-test models cached')
          "

      - name: "Run pytest with coverage"
        env:
          REQUIRE_SMOKE_MODELS: "1"   # a missing model fails instead of skipping
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            --timeout=120 \
            --timeout-method=thread \
            -p no:warnings

      - name: "Upload coverage to Codecov"
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: unittests
          name: "llm-fine-tuner-py311"
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # =========================================================================
  # JOB 4 — SECURITY
  # pip-audit scans the dependency declarations in requirements.txt for
  # known CVEs using the OSV (Open Source Vulnerabilities) database.
  # =========================================================================
  security:
    name: "Security — pip-audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: "Cache pip"
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: "audit-${{ hashFiles('requirements.txt') }}"
          restore-keys: "audit-"

      - name: "Install pip-audit"
        run: pip install --quiet pip-audit

      - name: "Audit requirements.txt for CVEs"
        run: |
          # GHSA-8mgp-746c-j5xp (nltk <= 3.10.3, no fixed release yet) affects
          # NLTK's model-artifact save/load APIs with caller-controlled paths.
          # This project only uses sentence_bleu and nlpaug's wordnet lookups, so
          # it is not reachable. Remove the waiver once nltk publishes a fix.
          # PYSEC-2026-1939 / GHSA-g4r7-86gm-pgqc (CVE-2024-35515, sqlitedict
          # <= 2.1.0, no fixed release): unpickling an untrusted cache file.
          # lm-eval only opens sqlitedict for simple_evaluate(use_cache=...),
          # which inference/benchmarks.py never passes (guarded by a test).
          pip-audit \
            --requirement requirements.txt \
            --skip-editable \
            --format columns \
            --progress-spinner off \
            --ignore-vuln GHSA-8mgp-746c-j5xp \
            --ignore-vuln PYSEC-2026-1939 \
            --ignore-vuln GHSA-g4r7-86gm-pgqc

  # =========================================================================
  # JOB 5 — DOCKER LINT
  # hadolint performs Dockerfile best-practice static analysis.
  # No image is built or pushed — lint only.
  #
  # Suppressed rules (intentional):
  #   DL3008 — apt-get version pins break when packages are removed from
  #             Ubuntu mirrors, which is common for CUDA base images.
  #   DL3013 — pip version pins are delegated to requirements.txt, not here.
  # =========================================================================
  docker-lint:
    name: "Docker lint — hadolint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint]

    steps:
      - uses: actions/checkout@v6

      - name: "Lint GPU Dockerfile"
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3013
          failure-threshold: warning

      - name: "Lint CPU Dockerfile"
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.cpu
          ignore: DL3008,DL3013
          failure-threshold: warning

  # =========================================================================
  # JOB 6 — VALIDATE PACKAGE
  # Builds an sdist + wheel and verifies the metadata with twine --strict.
  # Catches malformed entry_points, broken README rendering, and missing
  # METADATA fields before they reach PyPI or a user running pip install.
  # =========================================================================
  validate-package:
    name: "Validate packaging"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [lint]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: "Cache pip"
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: "pkg-${{ hashFiles('pyproject.toml', 'setup.py') }}"
          restore-keys: "pkg-"

      - name: "Install build toolchain"
        run: pip install --quiet "build>=1.2.0" twine "setuptools>=77" wheel

      - name: "Build sdist + wheel"
        # --no-isolation: reuse the current env (avoids a redundant heavy install)
        run: python -m build --sdist --wheel --no-isolation

      - name: "Verify dist with twine --strict"
        run: twine check --strict dist/*

      # A plain (non-editable) install must ship main.py — the console scripts
      # point at main:main — and must not install tests/ or docs/ as
      # top-level packages. --no-deps keeps this job fast; the test job covers
      # the runtime dependencies.
      - name: "Check wheel contents and entry points"
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet --no-deps dist/*.whl
          export REPO_DIR="$PWD"
          cd /tmp && /tmp/wheel-venv/bin/python - << 'EOF'
          import ast
          import importlib.util
          import os
          from importlib.metadata import distribution, entry_points, version

          # The version is written once, in config/constants.py (APP_VERSION).
          source = open(os.path.join(os.environ["REPO_DIR"], "config", "constants.py")).read()
          (app_version,) = [n.value.value for n in ast.parse(source).body
                            if isinstance(n, ast.Assign)
                            and getattr(n.targets[0], "id", None) == "APP_VERSION"]
          assert version("llm-fine-tuner") == app_version, (version("llm-fine-tuner"), app_version)

          top = {f.parts[0] for f in distribution("llm-fine-tuner").files}
          stray = top & {"tests", "archive", "docs", "build"}
          assert not stray, f"wheel installs non-application packages: {sorted(stray)}"
          scripts = entry_points(group="console_scripts")
          for name in ("llm-finetune", "app"):
              (ep,) = [e for e in scripts if e.name == name]
              assert importlib.util.find_spec(ep.module), f"{name}: module {ep.module} missing"
          print("wheel OK:", app_version, sorted(top))
          EOF

  # =========================================================================
  # JOB 7 — CI SUMMARY  (the only job that needs branch protection)
  # Always runs so the status never stays "pending" after a cancellation.
  # =========================================================================
  ci-summary:
    name: "CI Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs:
      - lint
      - type-check
      - test
      - security
      - docker-lint
      - validate-package

    steps:
      - name: "Evaluate job results"
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          python3 - << 'EOF'
          import json, os, sys

          results = json.loads(os.environ["RESULTS"])
          failed  = [
              name
              for name, data in results.items()
              if data.get("result") not in ("success", "skipped")
          ]

          if failed:
              print(f"❌ Failed jobs: {', '.join(failed)}", flush=True)
              sys.exit(1)

          print("✅ All CI jobs passed!", flush=True)
          EOF
