[build-system]
requires = ["setuptools>=77", "wheel"]  # 77+: SPDX `license` (PEP 639)
# C-1 FIX: "setuptools.backends.legacy:build" does not exist — correct value is "setuptools.build_meta"
build-backend = "setuptools.build_meta"


[project]
name = "llm-fine-tuner"
version = "3.2.0"
description = "Advanced LLM Fine-Tuner — SFT, DPO, ORPO, KTO, GRPO, reward modelling and evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yog-Sotho" }]
keywords = ["llm", "fine-tuning", "peft", "lora", "qlora", "dpo", "grpo", "kto", "orpo", "rlhf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]


# Core runtime dependencies — mirrors requirements.txt.
# Heavy optional deps (vllm, auto-gptq, bert-score, unsloth, heretic-llm) are listed
# under [project.optional-dependencies] and installed on demand.
dependencies = [
    "gradio>=6.0.0,<7",
    "transformers>=4.56.2,<6",
    "datasets>=4.0.0,<6",
    "peft>=0.17.0,<1",
    "accelerate>=1.4.0,<2",
    "bitsandbytes>=0.45.0",
    "trl>=0.29.1,<2",
    "torch>=2.6.0,<3",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "safetensors>=0.4.3",
    "tqdm>=4.66.0",
    "einops>=0.8.0",
    "matplotlib>=3.9.0",
    "huggingface_hub>=0.34.0,<2",
    "typer>=0.15.0",
    "pypdf>=6.16.1",
    "openpyxl>=3.1.0",
    "psutil>=6.0.0",
    # H-11 FIX: heretic-llm removed from core deps — if unavailable on PyPI it broke every install.
    # Install separately:  pip install heretic-llm>=1.2.0
    # or:  pip install "llm-fine-tuner[heretic]"
]


[project.optional-dependencies]
eval = [
    "evaluate>=0.4.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "nltk>=3.8.0",
    "nlpaug>=1.1.10",
    "lm-eval>=0.4.13,<0.5",  # standard benchmarks (ARC, HellaSwag, GSM8K, …)
    "math-verify>=0.5.2",  # GRPO maths-answer reward (TRL's accuracy_reward)
]
quant = [
    "auto-gptq>=0.7.1",
    "exllamav2",
]
vllm = [
    "vllm>=0.2.0",
]
# H-11 FIX: heretic-llm isolated in its own optional group so a missing package
# never breaks a standard install.
heretic = [
    "heretic-llm>=1.2.0",
]
dev = [
    "black>=24.0.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
all = [
    "llm-fine-tuner[eval,quant,vllm,heretic,dev]",
]


[project.scripts]
# After `pip install .` the `llm-finetune` command calls main:main directly.
llm-finetune = "main:main"
# Explicit entry point required by Vercel
app = "main:main"


[project.urls]
Homepage   = "https://github.com/Yog-Sotho/LLM-fine-tuner"
Repository = "https://github.com/Yog-Sotho/LLM-fine-tuner"
Issues     = "https://github.com/Yog-Sotho/LLM-fine-tuner/issues"


[tool.setuptools]
# main.py is a top-level module (the `llm-finetune` entry point), not a package.
py-modules = ["main"]

[tool.setuptools.packages.find]
# The modular repo keeps all modules flat at the project root. List the
# application packages explicitly so tests/, archive/ and docs/ are never
# installed as top-level packages.
where = ["."]
include = ["cli*", "config*", "core*", "data*", "export*", "inference*", "training*", "ui*"]


[tool.pytest.ini_options]
# M-8 FIX: was "." which caused pytest to scan the entire repo including archive/.
# Setting to "tests" scopes discovery to the dedicated test directory only.
testpaths   = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"


# pytest-cov has no --cov-omit flag; coverage.py reads its settings from here.
[tool.coverage.run]
omit = ["archive/*", "docs/*", "tests/*", "setup.py"]


[tool.ruff]
target-version = "py310"
line-length = 100
# archive/ holds deprecated code kept for reference only (never imported).
extend-exclude = ["archive"]


[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in argument defaults (Typer pattern)
]
