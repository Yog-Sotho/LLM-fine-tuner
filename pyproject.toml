[build-system]
requires = ["setuptools>=68", "wheel"]
# C-1 FIX: "setuptools.backends.legacy:build" does not exist — correct value is "setuptools.build_meta"
build-backend = "setuptools.build_meta"


[project]
name = "llm-fine-tuner"
version = "3.2.0"
description = "Advanced LLM Fine-Tuner — SFT, DPO, ORPO, PPO, reward modelling and evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yog-Sotho" }]
keywords = ["llm", "fine-tuning", "peft", "lora", "qlora", "dpo", "ppo", "orpo", "rlhf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]


# Core runtime dependencies — mirrors requirements.txt.
# Heavy optional deps (vllm, auto-gptq, bert-score, unsloth, heretic-llm) are listed
# under [project.optional-dependencies] and installed on demand.
dependencies = [
    "gradio>=5.0.0",
    "transformers>=4.48.0",
    "datasets>=3.0.0",
    "peft>=0.14.0",
    "accelerate>=1.3.0",
    "bitsandbytes>=0.45.0",
    "trl>=0.8.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "torchaudio>=2.5.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "safetensors>=0.4.3",
    "tqdm>=4.66.0",
    "einops>=0.8.0",
    "matplotlib>=3.9.0",
    "huggingface_hub>=0.25.0",
    "typer>=0.15.0",
    "PyPDF2>=3.0.0",
    "openpyxl>=3.1.0",
    "psutil>=6.0.0",
    # H-11 FIX: heretic-llm removed from core deps — if unavailable on PyPI it broke every install.
    # Install separately:  pip install heretic-llm>=1.2.0
    # or:  pip install "llm-fine-tuner[heretic]"
]


[project.optional-dependencies]
eval = [
    "evaluate>=0.4.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "nltk>=3.8.0",
    "nlpaug>=1.1.10",
]
quant = [
    "auto-gptq>=0.7.1",
    "exllamav2",
]
vllm = [
    "vllm>=0.2.0",
]
# H-11 FIX: heretic-llm isolated in its own optional group so a missing package
# never breaks a standard install.
heretic = [
    "heretic-llm>=1.2.0",
]
dev = [
    "black>=24.0.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
all = [
    "llm-fine-tuner[eval,quant,vllm,heretic,dev]",
]


[project.scripts]
# After `pip install .` the `llm-finetune` command calls main:main directly.
llm-finetune = "main:main"


[project.urls]
Homepage   = "https://github.com/Yog-Sotho/LLM-fine-tuner"
Repository = "https://github.com/Yog-Sotho/LLM-fine-tuner"
Issues     = "https://github.com/Yog-Sotho/LLM-fine-tuner/issues"


[tool.setuptools.packages.find]
# The modular repo keeps all modules flat at the project root.
where = ["."]


[tool.pytest.ini_options]
# M-8 FIX: was "." which caused pytest to scan the entire repo including archive/.
# Setting to "tests" scopes discovery to the dedicated test directory only.
testpaths   = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"


[tool.ruff]
target-version = "py310"
line-length = 100


[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in argument defaults (Typer pattern)
]
